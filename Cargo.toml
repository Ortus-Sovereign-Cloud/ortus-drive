[package]
name = "ortus-drive"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Drive: files, versions, sharing by label, previews."
repository = "https://github.com/Ortus-Sovereign-Cloud/ortus-drive"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
rust-embed = "8.14.0"
rust-web-server = "18.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
# Built from the commit in pins.toml (checked out by ci/fetch.sh), never
# from the branch: see the patch below.
ortus-core = { git = "https://github.com/Ortus-Sovereign-Cloud/ortus-core" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[patch."https://github.com/Ortus-Sovereign-Cloud/ortus-core"]
ortus-core = { path = ".deps/ortus-core" }

# Small debug builds: line numbers for our own code, no debug info for
# dependencies (a full debug build of the tests took 25 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
